name: Scratch Build WASM Artifact

# Temporary, disposable workflow used to obtain a genuine Linux-built vault
# WASM for comparison against a locally (Windows) built one, without
# installing WSL/Docker locally. Never merge this file to main.
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build vault WASM on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts
      - name: Resolve latest Stellar CLI version
        id: stellar-cli-version
        run: |
          VERSION=$(curl -sSf -H "User-Agent: meridian-ci (github.com/drydocs/meridian)" https://crates.io/api/v1/crates/stellar-cli | jq -r '.crate.max_stable_version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to resolve stellar-cli version from crates.io"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Stellar CLI binary
        id: cache-stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ steps.stellar-cli-version.outputs.version }}
      - name: Install Stellar CLI build dependencies
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli
      - name: Build contracts
        run: stellar contract build
        working-directory: packages/contracts
      - name: Hash built WASMs
        working-directory: packages/contracts/target/wasm32v1-none/release
        run: sha256sum meridian_vault.wasm meridian_blend_adapter.wasm meridian_musdc_token.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            packages/contracts/target/wasm32v1-none/release/meridian_vault.wasm
            packages/contracts/target/wasm32v1-none/release/meridian_blend_adapter.wasm
            packages/contracts/target/wasm32v1-none/release/meridian_musdc_token.wasm

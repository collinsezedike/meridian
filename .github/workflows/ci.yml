name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The Vercel serverless functions in api/ live outside the pnpm workspace,
      # so turbo doesn't cover them — typecheck them explicitly.
      - run: pnpm typecheck:api
      - name: Verify apps/api-local build output is flat
        run: |
          pnpm --filter @meridian/api-local build
          test -f apps/api-local/dist/index.js

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm coverage

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  pr-lint:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            style
            ci
            perf

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Drives the real dev stack against real Stellar testnet RPC (wallet
    # signing is mocked, see apps/web/e2e/fixtures.ts, but the API calls and
    # Soroban simulation are real), so this can be flaky on testnet RPC
    # hiccups in a way that's outside this repo's control. Non-blocking for
    # now; see #408.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api-local imports its workspace deps (@meridian/shared etc.) by
      # package resolution, which needs their dist/ output built first - the
      # dev server doesn't build them itself. Scoped to api-local's own
      # dependency graph so this doesn't also try to build contracts/docs.
      - run: pnpm exec turbo run build --filter=@meridian/api-local...
      - run: pnpm --filter @meridian/web exec playwright install --with-deps chromium
      - run: pnpm --filter @meridian/web test:e2e

  contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts
      - name: Check formatting
        working-directory: packages/contracts
        run: cargo fmt --all -- --check
      - name: Run clippy
        working-directory: packages/contracts
        run: cargo clippy --all-targets -- -D warnings
      - name: Run contract tests
        working-directory: packages/contracts
        run: cargo test
      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32-unknown-unknown --release

  verify-contracts:
    name: Verify Contract Addresses
    runs-on: ubuntu-latest
    # Only run on PRs that touch the files that record on-chain addresses, per
    # #389's original scope. Running on every PR would waste CI minutes and hit
    # Soroban RPC on unrelated changes.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed address files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            addresses:
              - 'packages/shared/src/constants.ts'
              - 'packages/stellar-sdk-helpers/src/known-pools.ts'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.addresses == 'true'
        with:
          # stellar contract build uses wasm32v1-none; the toolchain action
          # resolves the target name automatically with recent Rust toolchains.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.addresses == 'true'
        with:
          workspaces: packages/contracts
      - name: Install Stellar CLI
        if: steps.filter.outputs.addresses == 'true'
        run: cargo install stellar-cli --locked
      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.addresses == 'true'
      - uses: actions/setup-node@v6
        if: steps.filter.outputs.addresses == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.addresses == 'true'
      - name: Verify contract addresses against on-chain bytecode
        if: steps.filter.outputs.addresses == 'true'
        # The script itself retries the on-chain fetch up to 3 times with a
        # 3-second delay (see retry() in scripts/verify-contract-addresses.ts),
        # so no extra shell-level retry is needed here.
        run: pnpm verify:contracts
